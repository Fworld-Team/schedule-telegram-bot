name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python tests and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Check files before publishing
        run: python scripts/check_repository.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: Check initial schedule
        run: python -m schedule_bot --check
      - name: Validate server scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Build Docker image
        run: docker build -t schedule-bot:ci .
      - name: Check image as unprivileged user with read-only filesystem
        run: |
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=64m,mode=1777 \
            --tmpfs /data:uid=10001,gid=10001,mode=0700 \
            -e BOT_DATA_DIR=/data schedule-bot:ci \
            sh -c 'python -m schedule_bot --check && python -m schedule_bot --healthcheck'
