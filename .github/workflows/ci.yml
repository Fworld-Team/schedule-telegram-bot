name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/check_repository.py
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m schedule_bot --check
      - run: bash -n deploy/server/fworld-deploy-poll
      - name: Validate systemd units
        run: |
          sudo install -m 0755 deploy/server/fworld-deploy-poll /usr/local/sbin/fworld-deploy-poll
          systemd-analyze verify deploy/server/fworld-deploy.service deploy/server/fworld-deploy.timer
      - name: Verify widget flags in Compose
        env:
          ADMIN_USER_IDS: "123456789"
          BOT_DATA_VOLUME: fworld_bot_data
        run: |
          docker compose -f compose.yaml config --format json |
            jq -e '.services.bot.environment.BOT_SCHEDULE_WIDGETS == "0"'
          BOT_SCHEDULE_WIDGETS=1 docker compose -f compose.yaml config --format json |
            jq -e '.services.bot.environment.BOT_SCHEDULE_WIDGETS == "1"'
          production_widget_flag() {
            docker compose -f compose.yaml -f deploy/compose.production.yaml config --format json |
              jq -er '.services.bot.environment.BOT_SCHEDULE_WIDGETS | select(. == "0" or . == "1")'
          }
          disabled="$(BOT_SCHEDULE_WIDGETS=0 production_widget_flag)"
          enabled="$(BOT_SCHEDULE_WIDGETS=1 production_widget_flag)"
          test "$disabled" = "$enabled"
      - run: docker build -t schedule-telegram-bot:ci .
      - name: Validate the unprivileged, read-only image
        run: |
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=64m,mode=1777 \
            --tmpfs /data:uid=10001,gid=10001,mode=0700 \
            -e BOT_DATA_DIR=/data schedule-telegram-bot:ci \
            sh -c 'python -m schedule_bot --check && python -m schedule_bot --healthcheck'
