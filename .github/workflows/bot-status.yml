name: Server status

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-status
  cancel-in-progress: false

jobs:
  check:
    if: vars.MONITORING_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require monitoring configuration
        env:
          MONITORING_ENABLED: ${{ vars.MONITORING_ENABLED }}
        run: |
          if [ "$MONITORING_ENABLED" != true ]; then
            echo '::error::Server monitoring is not configured. See SERVER_SETUP.md.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check server, running container, and SQLite
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_MONITOR_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: bash scripts/remote.sh status
      - name: Record check time and scope
        run: |
          printf 'Checked at %s UTC\n\n' "$(date -u '+%F %T')" >> "$GITHUB_STEP_SUMMARY"
          printf 'Checks: SSH access, running container, Docker health, SQLite. Does not verify a Telegram reply.\n' >> "$GITHUB_STEP_SUMMARY"
