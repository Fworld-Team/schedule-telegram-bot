services:
  bot:
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      ADMIN_USER_IDS: "${ADMIN_USER_IDS:?Set ADMIN_USER_IDS in .env}"
      BOT_DATA_DIR: /data
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    secrets:
      - telegram_bot_token
    volumes:
      - bot_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-m", "schedule_bot", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt

volumes:
  bot_data:
